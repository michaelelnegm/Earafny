<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💛 اعرفني - لعبة الحب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 35px 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        /* ============================================
           الهيدر
           ============================================ */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .emoji-big {
            font-size: 3.5rem;
            display: block;
        }

        .header h1 {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(247, 151, 30, 0.3);
        }

        .header .sub {
            color: #aaa;
            font-size: 1.1rem;
            margin-top: 5px;
            font-weight: 400;
        }

        .header .sub span {
            color: #ffd200;
            font-weight: 700;
        }

        /* ============================================
           نموذج التسجيل
           ============================================ */
        .register-box {
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.06);
            text-align: center;
        }

        .register-box .label {
            color: #ddd;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: block;
        }

        .register-box .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .register-box .input-row input {
            flex: 1;
            min-width: 180px;
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .register-box .input-row input:focus {
            border-color: #f7971e;
            background: rgba(255,255,255,0.08);
        }

        .register-box .input-row input::placeholder {
            color: #666;
        }

        .register-box .gender-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 12px;
        }

        .register-box .gender-group label {
            color: #ccc;
            font-size: 1rem;
            cursor: pointer;
            padding: 8px 20px;
            border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.08);
            transition: all 0.3s ease;
        }

        .register-box .gender-group label:hover {
            border-color: #f7971e;
        }

        .register-box .gender-group input[type="radio"] {
            display: none;
        }

        .register-box .gender-group input[type="radio"]:checked+label {
            border-color: #f7971e;
            background: rgba(247, 151, 30, 0.15);
            color: #ffd200;
            box-shadow: 0 0 30px rgba(247, 151, 30, 0.1);
        }

        .btn-start {
            margin-top: 15px;
            padding: 14px 50px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 30px rgba(247, 151, 30, 0.4);
        }

        /* ============================================
           الأسئلة (تظهر بعد التسجيل)
           ============================================ */
        #questionsSection {
            display: none;
        }

        .question {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 14px;
            border-right: 4px solid #f7971e;
            transition: all 0.3s ease;
        }

        .question:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(-5px);
        }

        .question .q-number {
            display: inline-block;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            font-weight: 900;
            font-size: 0.8rem;
            padding: 2px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
        }

        .question .q-text {
            color: #eee;
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .question .q-input {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 1rem;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .question .q-input:focus {
            border-color: #f7971e;
            background: rgba(255,255,255,0.08);
        }

        .question .q-input::placeholder {
            color: #666;
            font-size: 0.9rem;
        }

        /* ============================================
           الأزرار
           ============================================ */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 35px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
            flex: 1;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
        }

        .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 30px rgba(247, 151, 30, 0.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
        }

        .btn-success:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 30px rgba(0, 206, 201, 0.4);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #fff;
        }

        .btn-whatsapp:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 30px rgba(37, 211, 102, 0.4);
        }

        /* ============================================
           النتيجة
           ============================================ */
        #resultSection {
            margin-top: 25px;
            display: none;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        #resultSection h2 {
            color: #ffd200;
            text-align: center;
            margin-bottom: 10px;
        }

        #resultSection pre {
            color: #a8d8ea;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            max-height: 400px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 12px;
        }

        #resultSection pre::-webkit-scrollbar {
            width: 5px;
        }
        #resultSection pre::-webkit-scrollbar-thumb {
            background: #f7971e;
            border-radius: 10px;
        }

        /* ============================================
           التجاوب
           ============================================ */
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .register-box .input-row input {
                min-width: 140px;
            }

            .question .q-text {
                font-size: 0.95rem;
            }

            .btn {
                font-size: 0.95rem;
                padding: 12px 20px;
                min-width: 100px;
            }
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .register-box .gender-group label {
                padding: 6px 14px;
                font-size: 0.85rem;
            }

            .question {
                padding: 14px 14px;
            }

            .btn {
                font-size: 0.85rem;
                padding: 10px 15px;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ============================================
    الهيدر
    ============================================ -->
    <div class="header">
        <span class="emoji-big">💛</span>
        <h1>اعرفني</h1>
        <p class="sub">لعبة الحب 🤍</p>
    </div>

    <!-- ============================================
    نموذج التسجيل
    ============================================ -->
    <div class="register-box" id="registerBox">
        <span class="label">✨ أدخل بياناتك وابدأ اللعبة</span>
        <div class="input-row">
            <input type="text" id="userName" placeholder="اسمك..." />
            <input type="text" id="partnerName" placeholder="اسم شريكك..." />
        </div>
        <div class="gender-group">
            <input type="radio" name="gender" id="genderMale" value="male" checked />
            <label for="genderMale">👨 ذكر</label>
            <input type="radio" name="gender" id="genderFemale" value="female" />
            <label for="genderFemale">👩 أنثى</label>
        </div>
        <button class="btn-start" onclick="startGame()">🚀 ابدأ اللعبة</button>
    </div>

    <!-- ============================================
    الأسئلة
    ============================================ -->
    <div id="questionsSection">

        <div id="questionsContainer">
            <!-- سيتم توليد الأسئلة بواسطة JavaScript -->
        </div>

        <!-- ============================================
        الأزرار
        ============================================ -->
        <div class="btn-group">
            <button class="btn btn-primary" onclick="showAnswers()">
                📤 عرض إجاباتي
            </button>
            <button class="btn btn-success" onclick="exportAnswers()">
                📋 نسخ الكل
            </button>
            <button class="btn btn-secondary" onclick="clearAll()">
                🗑️ مسح الكل
            </button>
        </div>

        <!-- ============================================
        النتيجة
        ============================================ -->
        <div id="resultSection">
            <h2>💛 إجاباتي</h2>
            <pre id="resultData"></pre>
            <div style="display: flex; gap: 12px; margin-top: 15px; flex-wrap: wrap;">
                <button class="btn btn-whatsapp" onclick="shareWhatsApp()" style="flex: 1; min-width: 120px;">
                    <i class="fab fa-whatsapp" style="margin-left: 8px;"></i> مشاركة على واتساب
                </button>
                <button class="btn btn-primary" onclick="copyResult()" style="flex: 1; min-width: 120px; background: linear-gradient(135deg, #6c5ce7, #a29bfe);">
                    📋 نسخ النص
                </button>
            </div>
        </div>
    </div>

</div>

<!-- ============================================
JavaScript
============================================ -->
<script>
    // ============================================
    // الأسئلة العامة (تناسب الجميع)
    // ============================================
    const QUESTIONS = [
        "إيه هو تاريخ ما عرفنا بعض فيه؟",
        "إيه هو تاريخ ميلادي؟",
        "إيه هي الأكلة المفضلة عندي؟",
        "إيه هو المشروب المفضل عندي؟",
        "إيه هي الرياضة اللي بحبها؟",
        "إيه هو الحيوان المفضل عندي؟",
        "إيه هو اللون المفضل عندي؟",
        "إيه هي الحاجة اللي بتخليني سعيد؟",
        "إيه هو المكان اللي نفسي أزوره؟",
        "إيه هي أغنية بحبها؟",
        "إيه هو فيلمي المفضل؟",
        "إيه هي حاجة بحبها في نفسي؟",
        "إيه هي حاجة بحبها فيك؟",
        "إيه هو أحلى موقف جمعنا؟",
        "إيه هي الكلمة اللي بتحبها مني؟",
        "إيه هو أحلى يوم في حياتي؟",
        "إيه هي الهدية اللي نفسي فيها؟",
        "إيه هي صفتي المفضلة في نفسي؟",
        "لو تصفني في ٣ كلمات، هتقول إيه؟",
        "إيه هي الذكرى اللي مش هتنساها معايا؟",
        "إيه هو الشيء اللي بتعمله وبيخليني أعرف إنك بتحبني؟",
        "إيه هي أكثر حاجة بتحبها في شخصيتي؟",
        "إيه هو أحلى مكان قابلتني فيه؟",
        "إيه هي الحاجة اللي بتضحكني دايماً؟"
    ];

    let userData = {};

    // ============================================
    // بدء اللعبة
    // ============================================
    function startGame() {
        const userName = document.getElementById('userName').value.trim();
        const partnerName = document.getElementById('partnerName').value.trim();
        const gender = document.querySelector('input[name="gender"]:checked').value;

        if (!userName || !partnerName) {
            alert('من فضلك أدخل اسمك واسم شريكك!');
            return;
        }

        userData = { userName, partnerName, gender };

        // إخفاء نموذج التسجيل
        document.getElementById('registerBox').style.display = 'none';

        // عرض الأسئلة
        document.getElementById('questionsSection').style.display = 'block';

        // توليد الأسئلة
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';

        QUESTIONS.forEach((q, index) => {
            const div = document.createElement('div');
            div.className = 'question';
            div.innerHTML = `
                        <span class="q-number">${index + 1}</span>
                        <div class="q-text">${q}</div>
                        <input class="q-input" type="text" placeholder="اكتب إجابتك..." data-q="${index + 1}" />
                    `;
            container.appendChild(div);
        });

        // إضافة Event Listeners للحفظ التلقائي
        document.querySelectorAll('.q-input').forEach(input => {
            input.addEventListener('input', saveProgress);
            input.addEventListener('change', saveProgress);
        });

        // تحميل البيانات المحفوظة
        loadProgress();

        // اختصار Enter
        document.querySelectorAll('.q-input').forEach((input, index, arr) => {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const next = arr[index + 1];
                    if (next) {
                        next.focus();
                    } else {
                        showAnswers();
                    }
                }
            });
        });

        // التمرير للأسئلة
        document.getElementById('questionsSection').scrollIntoView({ behavior: 'smooth' });
    }

    // ============================================
    // جلب جميع الإجابات
    // ============================================
    function getAnswers() {
        const inputs = document.querySelectorAll('.q-input');
        const answers = {};
        inputs.forEach(input => {
            const qNum = input.getAttribute('data-q');
            answers[qNum] = input.value.trim() || '(فارغ)';
        });
        return answers;
    }

    // ============================================
    // عرض الإجابات
    // ============================================
    function showAnswers() {
        const answers = getAnswers();
        const resultSection = document.getElementById('resultSection');
        const resultData = document.getElementById('resultData');

        let text = `💛 اعرفني - ${userData.userName} & ${userData.partnerName}\n`;
        text += `👤 ${userData.gender === 'male' ? 'ذكر' : 'أنثى'}\n`;
        text += '========================\n\n';
        for (const [key, value] of Object.entries(answers)) {
            text += `السؤال ${key}: ${value}\n`;
        }

        resultData.textContent = text;
        resultSection.style.display = 'block';
        resultSection.scrollIntoView({ behavior: 'smooth' });
    }

    // ============================================
    // نسخ الإجابات
    // ============================================
    function exportAnswers() {
        const answers = getAnswers();
        let text = `💛 اعرفني - ${userData.userName} & ${userData.partnerName}\n`;
        text += `👤 ${userData.gender === 'male' ? 'ذكر' : 'أنثى'}\n`;
        text += '========================\n\n';
        for (const [key, value] of Object.entries(answers)) {
            text += `السؤال ${key}: ${value}\n`;
        }
        text += '\n========================\n';
        text += '🤍 شكراً لمشاركتك!';

        navigator.clipboard.writeText(text).then(() => {
            alert('✅ تم نسخ الإجابات!');
        }).catch(() => {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('✅ تم نسخ الإجابات!');
        });
    }

    // ============================================
    // مشاركة على واتساب
    // ============================================
    function shareWhatsApp() {
        const answers = getAnswers();
        let text = `💛 اعرفني - ${userData.userName} & ${userData.partnerName}\n`;
        text += `👤 ${userData.gender === 'male' ? 'ذكر' : 'أنثى'}\n`;
        text += '========================\n\n';
        for (const [key, value] of Object.entries(answers)) {
            text += `السؤال ${key}: ${value}\n`;
        }
        text += '\n========================\n';
        text += '🤍 شكراً لمشاركتك!';

        const encoded = encodeURIComponent(text);
        window.open(`https://wa.me/?text=${encoded}`, '_blank');
    }

    // ============================================
    // نسخ النتيجة
    // ============================================
    function copyResult() {
        const resultData = document.getElementById('resultData');
        const text = resultData.textContent;

        navigator.clipboard.writeText(text).then(() => {
            alert('✅ تم نسخ الإجابات!');
        }).catch(() => {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('✅ تم نسخ الإجابات!');
        });
    }

    // ============================================
    // مسح الكل
    // ============================================
    function clearAll() {
        if (confirm('متأكد تمسح كل الإجابات؟')) {
            const inputs = document.querySelectorAll('.q-input');
            inputs.forEach(input => input.value = '');
            document.getElementById('resultSection').style.display = 'none';
            localStorage.removeItem('quizAnswers');
        }
    }

    // ============================================
    // حفظ تلقائي
    // ============================================
    function saveProgress() {
        const answers = getAnswers();
        const data = {
            userData: userData,
            answers: answers
        };
        localStorage.setItem('quizAnswers', JSON.stringify(data));
    }

    function loadProgress() {
        const saved = localStorage.getItem('quizAnswers');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                if (data.answers) {
                    const inputs = document.querySelectorAll('.q-input');
                    inputs.forEach(input => {
                        const qNum = input.getAttribute('data-q');
                        if (data.answers[qNum]) {
                            input.value = data.answers[qNum];
                        }
                    });
                }
            } catch (e) {
                console.log('خطأ في تحميل البيانات');
            }
        }
    }

    console.log('💛 اعرفني - لعبة الحب للجميع');
    console.log('🤍 أتمنى لك حباً جميلاً!');
</script>

</body>
</html>
